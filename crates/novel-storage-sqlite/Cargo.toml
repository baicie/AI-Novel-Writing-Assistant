[package]
name = "novel-storage-sqlite"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
test-harness = []

[[bin]]
name = "recovery_worker"
path = "src/bin/recovery_worker.rs"
required-features = ["test-harness"]

[dependencies]
async-trait.workspace = true
novel-application.workspace = true
novel-context.workspace = true
novel-domain.workspace = true
novel-llm.workspace = true
novel-prompt.workspace = true
novel-workflow.workspace = true
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
hex.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
