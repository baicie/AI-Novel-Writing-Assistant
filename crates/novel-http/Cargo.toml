[package]
name = "novel-http"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "本地创作内核的 HTTP 入口，用于把 Tauri 内核的 Rust 能力暴露给 Webview，使 Webview 可以保持原有的 fetch 调用。"

[dependencies]
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time", "net"] }
tracing.workspace = true
thiserror.workspace = true
async-trait.workspace = true
novel-application.workspace = true
novel-platform.workspace = true
novel-storage-sqlite.workspace = true
novel-domain.workspace = true

[dev-dependencies]
novel-llm.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"

