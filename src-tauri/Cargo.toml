[package]
name = "novel-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Biz Novel Studio local kernel"

[lib]
name = "novel_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
novel-application.workspace = true
novel-context.workspace = true
novel-domain.workspace = true
novel-llm.workspace = true
novel-platform = { workspace = true, features = ["os-keychain"] }
novel-storage-sqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
async-trait.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
