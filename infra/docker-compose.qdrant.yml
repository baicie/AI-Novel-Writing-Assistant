# 仅给本机源码开发单独起 Qdrant。
# 服务器 Docker 部署请用仓库根目录 docker-compose.yml，并加上 --profile rag。

services:
  qdrant:
    image: qdrant/qdrant:v1.15.4
    container_name: ai-novel-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
