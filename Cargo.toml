[workspace]
resolver = "3"
members = [
  "crates/novel-domain",
  "crates/novel-workflow",
  "crates/novel-application",
  "crates/novel-storage-sqlite",
  "crates/novel-llm",
  "crates/novel-context",
  "crates/novel-prompt",
  "crates/novel-platform",
  "crates/novel-testkit",
  "crates/novel-http",
  "migration-tools",
  "src-tauri",
]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
publish = false
version = "0.1.1-beta.5"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
async-trait = "0.1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
axum = { version = "0.7", default-features = false, features = ["http1", "json", "query", "tokio"] }
dashmap = "5.5"
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.5", default-features = false, features = ["cors", "trace"] }
novel-domain = { path = "crates/novel-domain" }
novel-workflow = { path = "crates/novel-workflow" }
novel-application = { path = "crates/novel-application" }
novel-storage-sqlite = { path = "crates/novel-storage-sqlite" }
novel-llm = { path = "crates/novel-llm" }
novel-context = { path = "crates/novel-context" }
novel-prompt = { path = "crates/novel-prompt" }
novel-platform = { path = "crates/novel-platform" }
novel-testkit = { path = "crates/novel-testkit" }
novel-http = { path = "crates/novel-http" }

# ---- 构建产物瘦身（2026-10-28）----
# 背景：target/debug/deps 反复膨胀，两天内从 23 GiB 涨到 31 GiB 以上，
#       增长几乎全部来自第三方依赖携带的完整 DWARF 调试信息。
# 做法：只对第三方依赖关闭调试信息；本 workspace 自己的 crate 仍保留完整调试信息，
#       所以调试自家代码、看自家断点不受影响，仅依赖内部栈回溯不再带行号。
[profile.dev.package."*"]
debug = false

# cargo test 的 test profile 继承自 dev；显式再声明一次，确保 CI/本地测试同样生效。
[profile.test.package."*"]
debug = false
